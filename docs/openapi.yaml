openapi: 3.1.0
info:
  title: Atlas Enterprise Data Intelligence Platform API
  version: 1.0.0
  description: |
    HTTP contract for the Atlas API. API-key administration and audit-log access
    require the administrator permission. Health and readiness probes are public.
servers:
  - url: http://localhost:8080
    description: Local development
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness probe
      description: Lightweight process liveness check. It does not query PostgreSQL.
      security: []
      responses:
        '200':
          description: The process is live; response body is empty.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /readyz:
    get:
      operationId: getReadiness
      summary: Readiness probe
      description: Public PostgreSQL readiness check with a two-second bounded ping.
      security: []
      responses:
        '200':
          description: PostgreSQL is reachable.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
              example:
                status: ready
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          description: PostgreSQL is not ready. Connection details are not returned.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: not_ready
                  message: service is temporarily unavailable
  /records:
    post:
      operationId: createRecord
      summary: Create a record
      description: Requires the records:write permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordInput'
            example:
              name: Ada Lovelace
              email: ada@example.com
      responses:
        '201':
          description: Record created.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Record'
              example:
                id: 42
                name: Ada Lovelace
                email: ada@example.com
        '400':
          description: Invalid JSON or invalid record fields (invalid_json or invalid_record).
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: The normalized email is already in use.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: duplicate_record
                  message: a record with this email already exists
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /records/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Positive base-10 record ID without leading zeroes.
        schema:
          type: string
          pattern: '^[1-9][0-9]*$'
    get:
      operationId: getRecord
      summary: Retrieve a record
      description: Requires the records:read permission.
      responses:
        '200':
          description: Record found.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Record'
              example:
                id: 42
                name: Ada Lovelace
                email: ada@example.com
        '400':
          description: The ID is malformed, non-positive, or outside the supported int64 range.
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No record exists with that ID.
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api-keys:
    get:
      operationId: listAPIKeys
      summary: List API key metadata
      description: Requires keys:manage. Key secrets and stored hashes are never returned.
      responses:
        '200':
          description: Key metadata, including revoked keys.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/APIKeyMetadata'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createAPIKey
      summary: Provision an API key
      description: |
        Requires keys:manage. The plaintext key is returned exactly once. Store
        it securely; subsequent responses and list operations expose metadata only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APIKeyInput'
            example:
              name: reporting job
              role: reader
              expires_at: '2027-01-01T00:00:00Z'
      responses:
        '201':
          description: Key created; api_key is shown only once.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyProvisioned'
              example:
                id: 11
                public_id: <opaque-public-selector>
                name: reporting job
                role: reader
                created_at: '2026-01-01T12:00:00Z'
                expires_at: null
                api_key: <returned-once-secret>
        '400':
          description: Invalid JSON, key name, role, or expiry timestamp. expires_at must be strictly in the future.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invalid_expiry
                  message: expires_at must be a future timestamp
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api-keys/{id}/role:
    parameters:
      - name: id
        in: path
        required: true
        description: Positive API key database ID without leading zeroes.
        schema:
          type: string
          pattern: '^[1-9][0-9]*$'
    patch:
      operationId: changeAPIKeyRole
      summary: Change an API key role
      description: Requires keys:manage. The last active administrator cannot be downgraded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleInput'
            example:
              role: writer
      responses:
        '200':
          description: Role updated; safe key metadata returned.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyMetadata'
        '400':
          description: Invalid ID, JSON, or role.
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No active API key exists with that ID.
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: The operation would remove the last active administrator.
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api-keys/{id}/rotate:
    parameters:
      - name: id
        in: path
        required: true
        description: Positive API key database ID without leading zeroes.
        schema:
          type: string
          pattern: '^[1-9][0-9]*$'
    post:
      operationId: rotateAPIKey
      summary: Atomically rotate an API key
      description: |
        Requires keys:manage. Creates a replacement key and revokes the active,
        non-expired source key in one PostgreSQL transaction. The role and expiry
        are inherited unless explicit replacements are supplied. Omitted or null
        expires_at preserves the source expiry. The one-time secret is never
        returned again; a successful rotation is audited without credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APIKeyRotationInput'
            examples:
              inherit:
                summary: Preserve the source role and expiry
                value: {}
              replaceRoleAndExpiry:
                summary: Explicitly set replacement role and expiry
                value:
                  role: writer
                  expires_at: '2027-01-01T00:00:00Z'
      responses:
        '201':
          description: Replacement created; api_key is shown only once.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyProvisioned'
              example:
                id: 12
                public_id: <opaque-new-public-selector>
                name: reporting job
                role: writer
                created_at: '2026-01-01T12:00:00Z'
                expires_at: '2027-01-01T00:00:00Z'
                api_key: <returned-once-secret>
        '400':
          description: Malformed JSON, invalid role, or expiry that is not in the future.
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Source key is missing, revoked, or expired.
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: Rotation would remove the last active administrator.
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api-keys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Positive API key database ID without leading zeroes.
        schema:
          type: string
          pattern: '^[1-9][0-9]*$'
    delete:
      operationId: revokeAPIKey
      summary: Revoke an API key
      description: Requires keys:manage. The last active administrator cannot be revoked.
      responses:
        '200':
          description: Key revoked; safe metadata returned.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyMetadata'
        '400':
          description: Malformed API key ID.
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No active API key exists with that ID.
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: The operation would remove the last active administrator.
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /roles:
    get:
      operationId: listRoles
      summary: List built-in roles
      description: Requires keys:manage.
      responses:
        '200':
          description: Built-in roles and permissions.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /audit-logs:
    get:
      operationId: listAuditEvents
      summary: List audit events
      description: |
        Requires keys:manage. Events are returned newest first by descending
        event ID. To fetch the next older page, pass before_id equal to the
        final event ID from the previous page; the cursor is exclusive.
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of events to return.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: before_id
          in: query
          required: false
          description: Positive exclusive event ID cursor for fetching older events.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: A page of events, newest first.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventPage'
              example:
                events:
                  - id: 23
                    occurred_at: '2026-01-01T12:00:00Z'
                    actor_key_id: 3
                    action: record.created
                    resource_type: record
                    resource_id: 42
                    details: {}
        '400':
          description: Invalid limit or cursor.
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          description: Audit storage is unavailable.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: audit_unavailable
                  message: audit log is temporarily unavailable
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Atlas API key
      description: API key passed in the Authorization header.
  headers:
    RequestID:
      description: Fresh 128-bit request identifier encoded as 32 lowercase hexadecimal characters.
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
  responses:
    BadRequest:
      description: Request validation failed.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing, malformed, incorrect, or revoked API key.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: authentication_required
              message: a bearer API key is required
    Forbidden:
      description: Valid API key does not have the required permission.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: permission_denied
              message: the API key does not have permission for this operation
    NotFound:
      description: Requested resource does not exist.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MethodNotAllowed:
      description: HTTP method is not supported for this endpoint. See Allow.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Allow:
          description: Methods supported by the endpoint.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: method_not_allowed
              message: method not allowed
    Conflict:
      description: Request conflicts with current resource state.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: last_admin_required
              message: the last active administrator API key cannot be revoked or downgraded
    RequestTooLarge:
      description: Request body exceeds the supported size.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: request_too_large
              message: request body exceeds the 1 MiB limit
    ServiceUnavailable:
      description: Backing storage or authentication service is unavailable.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: An unexpected internal error occurred.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    RecordInput:
      type: object
      additionalProperties: false
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 1
          description: Leading and trailing whitespace is trimmed.
        email:
          type: string
          format: email
          maxLength: 254
    Record:
      type: object
      additionalProperties: false
      required: [id, name, email]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
        email:
          type: string
          format: email
    APIKeyInput:
      type: object
      additionalProperties: false
      required: [name, role]
      properties:
        expires_at:
          type: [string, 'null']
          format: date-time
          description: Optional RFC 3339 expiry timestamp. Omitted or null means no expiry; supplied values must be strictly in the future and are stored in UTC.
        name:
          type: string
          minLength: 1
          maxLength: 100
        role:
          $ref: '#/components/schemas/RoleName'
    APIKeyRotationInput:
      type: object
      additionalProperties: false
      properties:
        role:
          anyOf:
            - $ref: '#/components/schemas/RoleName'
            - type: 'null'
          description: Optional replacement role; omitted or null preserves the source role.
        expires_at:
          type: [string, 'null']
          format: date-time
          description: Optional future RFC 3339 timestamp to replace the source expiry. Omitted or null preserves the source expiry; this field cannot clear an existing expiry.
    RoleInput:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/RoleName'
    RoleName:
      type: string
      enum: [reader, writer, admin]
    APIKeyFields:
      type: object
      required: [id, public_id, name, role, created_at, expires_at]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        public_id:
          type: string
          description: Non-secret lookup selector; not an API credential by itself.
        name:
          type: string
        role:
          $ref: '#/components/schemas/RoleName'
        created_at:
          type: string
          format: date-time
        expires_at:
          type: [string, 'null']
          format: date-time
          description: Expiry in UTC, or null for a non-expiring API key.
        created_by_key_id:
          type: integer
          format: int64
        revoked_at:
          type: string
          format: date-time
        revoked_by_key_id:
          type: integer
          format: int64
        last_used_at:
          type: string
          format: date-time
        role_changed_at:
          type: string
          format: date-time
        role_changed_by_key_id:
          type: integer
          format: int64
    APIKeyMetadata:
      type: object
      allOf:
        - $ref: '#/components/schemas/APIKeyFields'
      unevaluatedProperties: false
    APIKeyProvisioned:
      type: object
      allOf:
        - $ref: '#/components/schemas/APIKeyFields'
        - type: object
          required: [api_key]
          properties:
            api_key:
              type: string
              description: Plaintext API key, returned once only.
      unevaluatedProperties: false
    Role:
      type: object
      additionalProperties: false
      required: [name, description, permissions]
      properties:
        name:
          $ref: '#/components/schemas/RoleName'
        description:
          type: string
        permissions:
          type: array
          items:
            type: string
            enum: [records:read, records:write, keys:manage]
    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, occurred_at, action, resource_type, details]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        occurred_at:
          type: string
          format: date-time
        actor_key_id:
          type: integer
          format: int64
        action:
          type: string
          description: Currently record.created, api_key.created, api_key.role_changed, or api_key.revoked.
        resource_type:
          type: string
          enum: [record, api_key]
        resource_id:
          type: integer
          format: int64
        details:
          type: object
          additionalProperties:
            type: string
    AuditEventPage:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
    Readiness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ready
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
